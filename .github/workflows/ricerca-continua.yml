name: Ricerca frasi Common Crawl
 
on:
  schedule:
    # Parte ogni 7 ore: ~6 ore di lavoro (limite massimo di un job GitHub Actions)
    # + circa 1 ora di pausa prima del run successivo.
    - cron: '0 */7 * * *'
  workflow_dispatch: {}   # permette anche l'avvio manuale dalla tab "Actions"
 
# Evita che due run si sovrappongano se uno dovesse superare la finestra prevista
concurrency:
  group: ricerca-crawl
  cancel-in-progress: false
 
jobs:
  cerca:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # poco sotto il limite di 6h di GitHub, per sicurezza
 
    steps:
      - name: Checkout repo codice
        uses: actions/checkout@v4
 
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
 
      - name: Installa dipendenze
        run: pip install -r requirements.txt
 
      - name: Configura git
        run: |
          git config --global user.email "crawl-bot@users.noreply.github.com"
          git config --global user.name "Crawl Bot"
 
      - name: Esegui ricerca
        env:
          DATI_REPO: ${{ secrets.DATI_REPO }}
          DATI_REPO_TOKEN: ${{ secrets.DATI_REPO_TOKEN }}
        run: python cerca_frasi.py
